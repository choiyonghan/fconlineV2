services:
  - type: web
    name: fconlinev2-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # sync: false 항목은 Render 대시보드에서 배포 후 직접 값을 입력해야 한다
      # (이 파일은 git에 커밋되므로 실제 비밀번호/키를 여기에 적으면 안 된다).
      - key: SUPABASE_JDBC_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: NEXON_API_KEY
        sync: false
      - key: NEXON_API_KEY_2
        sync: false
      - key: NEXON_API_KEY_3
        sync: false
      - key: NEXON_API_KEY_4
        sync: false
      - key: NEXON_API_KEY_5
        sync: false
      - key: NEXON_API_KEY_6
        sync: false
      # 자연어 질문 분석(/api/v1/insights/ask)용 — Google AI Studio 무료 티어 키.
      - key: GEMINI_API_KEY
        sync: false
      # GitHub Pages 프론트(apps/web)만 브라우저에서 이 백엔드를 호출할 수 있게 허용한다.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://choiyonghan.github.io
