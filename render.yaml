services:
  - type: web
    name: fconlinev2-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    # insight-snapshot.yml이 매일 data/에 스냅샷 JSON을 커밋한다 — 백엔드는 그 파일을
    # raw.githubusercontent.com에서 읽기만 하므로(GithubInsightSnapshotClient), 이 커밋만으로는
    # 재배포가 필요 없다. 불필요한 매일 재배포를 막기 위해 빌드 트리거에서 제외한다.
    buildFilter:
      ignoredPaths:
        - data/**
    envVars:
      # sync: false 항목은 Render 대시보드에서 배포 후 직접 값을 입력해야 한다
      # (이 파일은 git에 커밋되므로 실제 비밀번호/키를 여기에 적으면 안 된다).
      - key: SUPABASE_JDBC_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: NEXON_API_KEY
        sync: false
      - key: NEXON_API_KEY_2
        sync: false
      - key: NEXON_API_KEY_3
        sync: false
      - key: NEXON_API_KEY_4
        sync: false
      - key: NEXON_API_KEY_5
        sync: false
      - key: NEXON_API_KEY_6
        sync: false
      # 자연어 질문 분석(/api/v1/insights/ask)용 — Google AI Studio 무료 티어 키.
      - key: GEMINI_API_KEY
        sync: false
      # "닉네임:실명" 콤마 구분 목록(예: 서울쥐:김상기,욱냥0I:전승욱) — 실명은 public 저장소에
      # 커밋하면 안 되므로 반드시 Render 대시보드에서 직접 입력한다.
      - key: TRACKED_USER_REAL_NAMES
        sync: false
      # GitHub Pages 프론트(apps/web)만 브라우저에서 이 백엔드를 호출할 수 있게 허용한다.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://choiyonghan.github.io
      # 무료 Redis 캐시(RedisCacheConfig) — 옵트인이라 둘 다 채워야 실제로 켜진다. REDIS_URL은
      # Upstash(무료 티어) 콘솔의 "Redis Connect" 탭에 있는 rediss://default:<비밀번호>@<host>:<port>
      # 형태 연결 문자열을 그대로 붙여넣는다. CACHE_TYPE 없이 REDIS_URL만 있으면 여전히 캐시 비활성
      # (spring.cache.type 기본값 simple) — 둘 다 안 채우면 이 앱은 지금처럼 캐시 없이 동작한다.
      - key: CACHE_TYPE
        sync: false
      - key: REDIS_URL
        sync: false
      # 카톡 성격 리포트(.md, 실명 파일명)를 올려둔 Supabase Storage private bucket 접근용
      # (PersonalityReportClient) — DB와 같은 Supabase 프로젝트, Project Settings → API에서
      # URL/service_role key 확인. 셋 다 안 채우면 성격 리포트 없이(전적 데이터만으로) 그대로
      # 동작한다(옵트인).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # FC Online 추적 대상이 아닌 친구의 성격 리포트 — "실명:Supabase Storage 키" 콤마 구분
      # (예: "이용민:leeyongmin,처리:cheori"). 실명이 들어가므로 TRACKED_USER_REAL_NAMES와
      # 마찬가지로 반드시 Render 대시보드에서 직접 입력한다.
      - key: PERSONALITY_EXTRA_PEOPLE
        sync: false
