spring:
  application:
    name: fconline-backend

  datasource:
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/fconline}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 소유한다. JPA는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

nexon:
  api:
    base-url: https://open.api.nexon.com/fconline/v1
    keys: ${NEXON_API_KEY:},${NEXON_API_KEY_2:},${NEXON_API_KEY_3:}
    request-delay-ms: ${NEXON_API_REQUEST_DELAY_MS:300}

sync:
  match-type: ${SYNC_MATCH_TYPE:CUSTOM}
  match-fetch-limit: ${SYNC_MATCH_FETCH_LIMIT:100}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fconline: INFO
