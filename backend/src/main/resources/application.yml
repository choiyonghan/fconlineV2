spring:
  application:
    name: fconline-backend

  datasource:
    # v1(choiyonghan/fconline) 프로젝트의 Supabase 프로젝트 ref(jwqhpdtizrpyohlrqfgu)로
    # 만든 기본 직접연결 호스트. v1 저장소(app.js/official.js)에는 SUPABASE_URL과 anon key만
    # 공개되어 있고(브라우저용, 정상), 실제 DB 접속 비밀번호는 어디에도 커밋되어 있지 않다
    # (GitHub Actions Secrets로만 주입됨 — 정상적인 설계). 아래 SUPABASE_JDBC_URL 기본값은
    # 호스트만 맞춰둔 것이고, SUPABASE_DB_PASSWORD는 반드시 직접 넣어야 한다
    # (Supabase 대시보드 → Project Settings → Database → Connection string에서 확인/재발급).
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://db.jwqhpdtizrpyohlrqfgu.supabase.co:5432/postgres?currentSchema=fconline}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # pgjdbc가 JDBC batch(SpidMetaSyncAdapter)를 다중 VALUES INSERT 한 문장으로 재작성하게
      # 한다. 없으면 batchUpdate를 써도 실제로는 건별 왕복이 그대로 나가 원격 pooler(리전이
      # 다르면 왕복 지연이 큼) 상대로는 batch의 이득이 거의 없다.
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 소유한다. JPA는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        # v1이 지금도 운영 중인 라이브 Supabase 프로젝트를 그대로 재사용하기 때문에,
        # public 스키마(v1 테이블: users/matches/match_details/...)를 절대 건드리지 않도록
        # fconline 전용 Postgres 스키마에 완전히 격리한다 (구 v2 스키마는 폐기 예정 — 삭제 전까지
        # 과거 데이터가 남아있지만 이 앱은 더 이상 그 스키마를 쓰지 않는다).
        default_schema: fconline

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: fconline
    default-schema: fconline
    locations: classpath:db/migration

  # RecordFacade의 조회 API/InsightFacade.ask() 캐시(RedisCacheConfig 참고). 기본값은 simple
  # (인메모리, 프로세스 재시작 시 초기화)이라 로컬/CI/테스트엔 Redis가 전혀 필요 없다. 프로덕션은
  # Render 환경변수로 CACHE_TYPE=redis + REDIS_URL(Upstash 무료 티어 등의 rediss://... 연결
  # 문자열)을 같이 넣어야 실제로 Redis를 쓴다 — REDIS_URL만 있고 CACHE_TYPE이 없으면 여전히
  # simple로 동작한다(둘 다 명시적으로 켜야 하는 옵트인 설계).
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # 무료 티어 Redis는 순간적으로 느려지거나 끊길 수 있어 요청이 무한정 물리지 않게 짧게 끊는다
      # (LoggingCacheErrorHandler가 타임아웃도 다른 캐시 오류와 동일하게 로그만 남기고 DB로 폴백).
      timeout: 2000ms
      connect-timeout: 2000ms

server:
  # Render 등 컨테이너 호스팅은 PORT 환경변수로 리스닝 포트를 지정한다 —
  # 없으면(로컬/기존 SERVER_PORT 관례) 그대로 폴백한다.
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

nexon:
  api:
    base-url: https://open.api.nexon.com/fconline/v1
    keys: ${NEXON_API_KEY:},${NEXON_API_KEY_2:},${NEXON_API_KEY_3:},${NEXON_API_KEY_4:},${NEXON_API_KEY_5:},${NEXON_API_KEY_6:}
    request-delay-ms: ${NEXON_API_REQUEST_DELAY_MS:300}

gemini:
  api:
    # 2026-08-31 마이그레이션 이력(Gemini → Groq → Gemini):
    # 1) 원래 Gemini를 썼는데, 당시 프로젝트 키가 Google 기준 "신규 사용자"로 분류돼
    #    gemini-3.6-flash 하나만 쓸 수 있고(gemini-2.5-flash는 404, gemini-3-flash는 존재하지
    #    않는 ID) 그마저 무료 하루 한도가 20회라 실사용이 불가능해서(운영에서 RESOURCE_EXHAUSTED
    #    겪음) Groq(OpenAI 호환)로 완전히 갈아탔다.
    # 2) Groq에서 모델을 두 번 더 바꿔봤지만(llama-3.3-70b-versatile→openai/gpt-oss-120b→
    #    groq/compound) 전부 분당 토큰(TPM) 한도가 우리 프롬프트 크기(성격 리포트를 통째로 넣어
    #    질문 1건당 약 1만~2만 토큰)보다 작아서 413/429가 계속 났다 — gpt-oss-*/qwen* 계열은 TPM
    #    8,000 고정, groq/compound(TPM 30,000)도 내부적으로 openai/gpt-oss-120b로 라우팅될 때가
    #    있어 여전히 불안정했다.
    # 3) 새 구글 계정으로 Gemini API 키를 다시 발급해보니, *-flash-lite 계열
    #    (gemini-3.1-flash-lite, gemini-3.5-flash-lite)은 신규 사용자에게도 RPD 500 · TPM
    #    250,000이 열려 있다는 걸 확인했다(https://aistudio.google.com/rate-limit,
    #    일반 -flash/-pro 계열만 RPD 20으로 막혀있고 -flash-lite는 예외 — 모델마다 등급이 다름).
    #    실제 프롬프트(성격 리포트 24KB 포함) 그대로 curl 테스트해 9,432 토큰으로 정상 응답까지
    #    확인하고 최종적으로 Gemini(gemini-3.1-flash-lite)로 복귀했다.
    base-url: https://generativelanguage.googleapis.com/v1beta
    key: ${GEMINI_API_KEY:}
    # 필요하면 GEMINI_MODEL로 다른 모델 지정 가능 — 바꾸기 전엔 반드시
    # https://aistudio.google.com/rate-limit (로그인 필요)에서 그 모델의 RPD/TPM이 신규
    # 사용자에게도 우리 프롬프트 크기(질문 1건당 대략 1만 토큰)와 실사용 빈도를 감당하는지
    # 먼저 확인할 것 — 모델명만 보고 예전 -flash/-pro 계열로 되돌아가면 RPD 20에 다시 걸린다.
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

sync:
  match-type: ${SYNC_MATCH_TYPE:CUSTOM}
  match-fetch-limit: ${SYNC_MATCH_FETCH_LIMIT:100}

tracked-user:
  # "닉네임:실명" 콤마 구분 목록 — AI 질문이 실명으로 들어와도 같은 사람인 걸 알아보게 한다
  # (TrackedUserAliasResolver). 이 저장소는 public이라 실명을 git에 커밋하지 않는다 —
  # 로컬 기본값은 항상 비워두고, 프로덕션은 Render 환경변수(TRACKED_USER_REAL_NAMES)로만 채운다.
  real-names: ${TRACKED_USER_REAL_NAMES:}

insight:
  snapshot:
    # 매일 아침 insight-snapshot.yml이 data/insight-snapshots/에 커밋해둔 JSON을 여기서 읽는다
    # (DB 테이블 없이 리포지토리 자체를 캐시 저장소로 사용 — InsightFacade 참고).
    raw-base-url: ${INSIGHT_SNAPSHOT_RAW_BASE_URL:https://raw.githubusercontent.com/choiyonghan/fconlineV2/main/data/insight-snapshots}

personality:
  # FC Online 추적 대상이 아닌(ouid 없는) 친구의 성격 리포트 — "실명:Supabase Storage 키" 콤마
  # 구분(예: "이용민:leeyongmin,처리:cheori"). 로마자 키를 쓰는 이유는 PersonalityReportClient
  # 주석 참고(Supabase Storage가 한글 키를 거절함). 실명이 들어가므로 TRACKED_USER_REAL_NAMES와
  # 마찬가지로 Render 환경변수로만 채운다.
  extra-people: ${PERSONALITY_EXTRA_PEOPLE:}

supabase:
  storage:
    # 카톡 성격 리포트(.md, 실명 파일명)를 올려둔 Supabase Storage private bucket —
    # DB와 같은 Supabase 프로젝트를 재사용한다(PersonalityReportClient 참고). URL은
    # "https://xxxx.supabase.co" 형태(Project Settings → API), serviceRoleKey는 RLS를
    # 우회하는 백엔드 전용 키라 반드시 Render 환경변수로만 채운다(절대 커밋 금지).
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:personality-reports}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # 캐시는 있으면 좋고 없어도 그만인 최적화일 뿐이라, Redis(특히 외부 무료 서비스)가 끊겨도
      # 앱 전체 헬스체크(Render healthCheckPath)를 DOWN으로 끌고 가면 안 된다.
      enabled: false

logging:
  level:
    com.fconline: INFO
