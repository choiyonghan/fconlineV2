name: Keep Backend Alive

# Render 무료 티어는 15분간 요청이 없으면 잠들고, 다음 요청에서 콜드스타트(수십 초)가 난다.
# 10분마다 헬스체크를 찔러서 절대 안 잠들게 한다 — 무료 티어 월 750시간 한도 안에 들어온다
# (24시간 x 31일 = 744시간). GitHub Actions는 public 저장소라 무제한 무료.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Render 콜드 스타트(JVM 부팅 + Flyway 마이그레이션)가 90초를 넘기는 경우가 있어
        # max-time 90에서 계속 실패하고 있었다 — 그러면 이 워크플로우 자체가 "깨우는 역할"을
        # 못 해서 계속 잠든 채로 남는 악순환이 된다. 시간을 넉넉히 늘리고, 그래도 실패하면
        # 한 번 더 재시도한다(첫 요청이 콜드 스타트를 트리거해두고, 두 번째 요청 때는
        # 이미 깨어난 상태라 빠르게 응답할 가능성이 높다).
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL 변수가 아직 설정 안 됨 — 스킵"
            exit 0
          fi
          curl -sf --max-time 180 "${{ vars.VITE_API_BASE_URL }}/actuator/health" || \
          curl -sf --max-time 180 "${{ vars.VITE_API_BASE_URL }}/actuator/health"
