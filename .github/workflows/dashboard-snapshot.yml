name: Build Dashboard Snapshot

# 메인 대시보드(site-root/index.html)는 백엔드(Render 무료 티어)가 잠들어 있어도 즉시 뜨게
# 하려고 실시간 API 호출을 하지 않는다 — 이 배치가 하루 한 번 9명 트래커 유저의 요약 +
# AI(Gemini) 랭킹을 미리 만들어 data/dashboard-snapshot.json으로 커밋해두면, 프론트가
# raw.githubusercontent.com에서 그 파일만 fetch한다(insight-snapshot.yml과 같은 컨벤션).
# sync.yml(KST 09:15 매치 동기화)과 insight-snapshot.yml(KST 09:30) 다음 순서로 09:45에 돈다.
on:
  schedule:
    - cron: '45 0 * * *' # KST 09:45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build backend jar
        run: ./gradlew :backend:bootJar --console=plain

      - name: Run dashboard snapshot batch (DB/Gemini에서 읽기만 함, 쓰기는 로컬 JSON 파일)
        env:
          SPRING_PROFILES_ACTIVE: dashboard-snapshot
          SUPABASE_JDBC_URL: ${{ secrets.SUPABASE_JDBC_URL }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # AI 랭킹(9명 종합 실력 순위 + 근거)용 — 실패해도 배치는 승률 기준 대체 랭킹으로 계속
          # 진행한다(DashboardSnapshotBuilder 참고), 워크플로우 자체를 막지 않는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          java -jar backend/build/libs/*.jar --spring.profiles.active=dashboard-snapshot

      - name: Commit and push snapshot file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-snapshot.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 대시보드 스냅샷 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
