name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'site-root/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # GitHub 프로젝트 페이지는 username.github.io/${{ github.event.repository.name }}/
          # 서브패스에서 서빙된다 — svelte.config.js가 이 값을 kit.paths.base로 읽는다.
          # 사이트 루트(/)는 정적 매치 리포트(site-root/index.html)가 차지하므로, SvelteKit 대시보드는
          # 그 밑의 /app 서브패스에서 서빙된다(아래 "Compose Pages site" 단계 참고).
          BASE_PATH: /${{ github.event.repository.name }}/app

      - name: Compose Pages site (매치 리포트 = /, SvelteKit 대시보드 = /app/)
        working-directory: .
        run: |
          set -e
          rm -rf site
          mkdir -p site/app
          cp -r apps/web/build/. site/app/
          cp -r site-root/. site/
          cp apps/web/static/favicon.svg site/favicon.svg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
