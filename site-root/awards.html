<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2128;
    --panel-2: #151b21;
    --gold: #e8c547;
    --gold-dim: #4a3d10;
    --text: #f5f7fa;
    --muted: #8c98a4;
    --silver: #c0c8d0;
    --bronze: #b08d57;
    --green: #4ade80;
    --red: #f87171;
    --line: #2a333c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 16:9 무대 — 뷰포트에 맞춰 스케일하지 않고 비율만 유지해 글자가 또렷하게 남게 한다. */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .deck { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); position: relative; }

  .slide {
    position: absolute; inset: 0;
    padding: clamp(18px, 3.2vmin, 46px) clamp(20px, 3.6vmin, 54px) clamp(40px, 5vmin, 64px);
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden;
    transition: opacity .28s ease;
  }
  .slide.active { opacity: 1; visibility: visible; }

  /* 폰트 크기는 전부 데크 높이(cqh) 기준 — 창 크기를 바꿔도 레이아웃이 안 깨진다. */
  .deck { container-type: size; }
  .slide { font-size: 2.1cqh; }

  /* ---------- 표지 ---------- */
  .cover { justify-content: center; }
  .cover-kicker { color: var(--muted); letter-spacing: .5em; font-size: 2.3cqh; }
  .cover-title { font-size: 11cqh; font-weight: 800; line-height: 1.05; margin: 1.4cqh 0 2.2cqh; }
  .cover-rule { width: 100%; height: .5cqh; background: var(--gold); margin-bottom: 3cqh; }
  .cover-sub { color: var(--gold); font-size: 2.6cqh; letter-spacing: .06em; }
  .cover-stats { display: flex; gap: 6cqh; margin-top: 7cqh; }
  .cover-stats .v { font-size: 6cqh; font-weight: 800; color: var(--gold); line-height: 1; }
  .cover-stats .k { font-size: 2cqh; color: var(--muted); margin-top: .9cqh; }
  .cover-meta { color: var(--muted); font-size: 1.8cqh; margin-top: auto; }

  /* ---------- 공통 헤더 ---------- */
  .head { display: flex; align-items: flex-start; gap: 2cqh; }
  .head h2 { font-size: 5.6cqh; font-weight: 800; line-height: 1.15; }
  .head .basis { color: var(--muted); font-size: 2cqh; margin-top: 1cqh; }
  .counter { margin-left: auto; color: var(--gold); font-weight: 700; font-size: 2.4cqh; white-space: nowrap; }
  .rule { height: 2px; background: var(--line); margin: 2.2cqh 0; }

  /* ---------- 어워드 ---------- */
  .podium { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .first {
    display: flex; align-items: center; gap: 2.6cqh;
    background: var(--panel); border: 1.5px solid var(--gold); border-radius: 1.4cqh;
    padding: 2.6cqh 3cqh;
  }
  .first .medal { font-size: 7cqh; line-height: 1; }
  .first .who { font-size: 4.4cqh; font-weight: 800; line-height: 1.2; }
  .first .detail { color: var(--gold); font-size: 2.5cqh; margin-top: 1cqh; }

  .runner {
    display: flex; align-items: center; gap: 2.2cqh;
    background: var(--panel-2); border: 1px solid #232c34; border-radius: .9cqh;
    padding: 1.5cqh 3cqh; margin-top: 1.4cqh;

  .runner .medal { font-size: 3.4cqh; line-height: 1; }
  .runner .who { font-size: 2.5cqh; font-weight: 700; }
  .runner.s2 .who { color: var(--silver); }
  .runner.s3 .who { color: var(--bronze); }
  .runner .detail { margin-left: auto; color: var(--muted); font-size: 2.1cqh; text-align: right; }

  .comment {

    padding: 1.8cqh 2.4cqh;

  .comment .body { color: #ede3c6; font-size: 2.4cqh; font-style: italic; line-height: 1.5; }

  .section h2 { font-size: 8.5cqh; font-weight: 800; }
  .section p { color: var(--muted); font-size: 2.4cqh; margin-top: 1.6cqh; }

  table { width: 100%; border-collapse: collapse; font-size: 2.2cqh; }
  th, td { padding: 1.15cqh .6cqh; border-bottom: 1px solid var(--line); text-align: center; }
  th { color: var(--gold); background: var(--panel); font-weight: 700; }
  td.name { text-align: left; padding-left: 1.4cqh; }
  tr.top td { font-weight: 700; }
  tr.top td.rank { color: var(--gold); }
  td.rank { color: var(--muted); font-weight: 700; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  /* ---------- 기준/한계 ---------- */
  .notes { display: grid; grid-template-columns: 16cqh 1fr; gap: 1.5cqh 2.4cqh; align-content: start; }
  .notes dt { color: var(--gold); font-weight: 700; font-size: 2cqh; }
  .notes dd { color: var(--silver); font-size: 1.95cqh; line-height: 1.45; }
  .notes.lg { gap: 2.6cqh 2.8cqh; grid-template-columns: 18cqh 1fr; margin-top: 2cqh; }
  .notes.lg dt { font-size: 2.7cqh; }
  .notes.lg dd { font-size: 2.5cqh; line-height: 1.5; }

  /* ---------- 하단 바 ---------- */
  .footbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3.4cqh;
    background: var(--panel); display: flex; align-items: center;
    padding: 0 3cqh; font-size: 1.6cqh; color: var(--muted);
  }
  .footbar .right { margin-left: auto; }
  .footbar .back { color: var(--gold); text-decoration: none; font-weight: 700; }
  .footbar .back:hover { text-decoration: underline; }

  #progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); z-index: 20; transition: width .25s ease; }

  /* ---------- 전체 보기 ---------- */
  #overview {
    position: fixed; inset: 0; background: rgba(8, 11, 14, .97); z-index: 30;
    overflow-y: auto; padding: 3vh 3vw; display: none;
  }
  #overview.open { display: block; }
  #overview h3 { font-size: 24px; margin-bottom: 4px; }
  #overview .hint { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card {

  .card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .card .t { font-weight: 700; font-size: 14px; }
  .card .w { color: var(--gold); font-size: 12px; margin-top: 6px; }
  .card .n { color: var(--muted); font-size: 11px; margin-top: 3px; }

  #help {

    padding: 5px 9px; border-radius: 6px; border: 1px solid #242d36;
  }
  #help { transition: opacity .6s ease; }
  #help.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { #help { display: none; } }
</style>

    const diff = r.goalsFor - r.goalsAgainst;
    rows += '<tr' + (r.rank <= 3 ? ' class="top"' : '') + '>' +
      '<td class="rank">' + r.rank + '</td>' +
      '<td class="name">' + esc(r.nickname) + ' <span style="color:var(--muted)">(' + esc(r.realName) + ')</span></td>' +
      '<td>' + r.games + '</td><td>' + r.win + '</td><td>' + r.draw + '</td><td>' + r.lose + '</td>' +
      '<td style="color:var(--gold)"><b>' + r.adjPoints.toFixed(2) + '</b></td>' +
      '<td>' + r.goalsFor + '</td><td>' + r.goalsAgainst + '</td>' +
      '<td class="' + (diff > 0 ? 'pos' : 'neg') + '">' + (diff > 0 ? '+' : '') + diff + '</td>' +
      '<td>' + r.avgRating.toFixed(2) + '</td></tr>';
  }
  slides.push({
    nav: '최종 순위',
    html: '<div class="slide">' +
      '<div class="head"><div><h2>시즌2 최종 순위</h2><div class="basis">보정 승점 기준 · 커스텀 매치 · 전체 상대 합산 (경기당, 승3·무1)</div></div></div>' +
      '<div class="rule"></div>' +
      '<table><thead><tr><th>#</th><th style="text-align:left;padding-left:1.4cqh">유저</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>보정승점</th><th>득점</th><th>실점</th><th>득실</th><th>평점</th></tr></thead><tbody>' +
      rows + '</tbody></table>' + footbar('보정 승점 = 가상 경기 ' + DATA.correction.seasonPrior + '판을 얹은 경기당 승점') + '</div>'
  });
}

function sectionSlide(title, sub, count) {
  slides.push({
    nav: title,
    html: '<div class="slide section">' +
      '<div class="count">' + count + '개 부문</div>' +
      '<div class="bar"></div>' +
      '<h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p>' + footbar() + '</div>'
  });
}

function awardSlide(a, idx, total) {
  const win = a.rows[0];
  let runners = '';
  a.rows.slice(1).forEach((r, i) => {
    runners += '<div class="runner s' + (i + 2) + '"><span class="medal">' + MEDAL[i + 1] + '</span>' +
      '<span class="who">' + esc(r.who) + '</span><span class="detail">' + esc(r.detail) + '</span></div>';
  });
  slides.push({
    nav: a.title, section: a.section, award: a,
    html: '<div class="slide">' +
      '<div class="head"><div><h2>' + a.icon + ' ' + esc(a.title) + '</h2>' +
      '<div class="basis">' + esc(a.basis) + '</div></div>' +
      '<div class="counter">' + String(idx).padStart(2, '0') + ' / ' + String(total).padStart(2, '0') + '</div></div>' +
      '<div class="rule"></div>' +
      '<div class="podium">' + (win ? '<div class="first"><span class="medal">' + MEDAL[0] + '</span><div>' +
        '<div class="who">' + esc(win.who) + '</div><div class="detail">' + esc(win.detail) + '</div></div></div>' : '') +
      runners + '</div>' +
      (a.comment ? '<div class="comment"><div class="label">💬 한줄평</div><div class="body">' + esc(a.comment) + '</div></div>' : '') +
      footbar(a.section) + '</div>'
  });
}

const userAwards = DATA.awards.filter((a) => a.section === '유저 부문');
const playerAwards = DATA.awards.filter((a) => a.section === '선수 부문');

sectionSlide('유저 부문', '9명이 직접 쌓은 기록 — 승률부터 삽질까지', userAwards.length);
userAwards.forEach((a, i) => awardSlide(a, i + 1, userAwards.length));
sectionSlide('선수 부문', '9명의 스쿼드 전체를 합산한 선수 카드 기록', playerAwards.length);
playerAwards.forEach((a, i) => awardSlide(a, i + 1, playerAwards.length));

// 기준과 한계
{
  const notes = [
    ['대상', '커스텀 매치만 (공식전 제외). 시즌2 = 2026-10-28 종료, seasonId=2.'],
    ['원본', '인사이트 스냅샷 ' + DATA.snapshotAt.slice(0, 10) + ' 집계분 (추적 유저 9명 × 커스텀).'],
    ['보정', '비율 지표는 전부 베이지안 축소로 보정했다 — 리그 평균짜리 가상 경기를 분모 중앙값의 40%만큼(경기 기준 약 ' + DATA.correction.seasonPrior + '판) 얹고 계산한다. 경기 수 최소 컷은 두지 않았다, 보정이 그 역할을 대신한다.'],
    ['교차 확인', '상대 강도까지 보정하는 Bradley-Terry 레이팅으로도 계산해봤고 상위 4명 순서는 같았다. 5위 이하만 한두 칸 달라진다.'],
    ['선수 부문', '9명의 스쿼드를 선수 이름 기준으로 전부 합산했다. 같은 선수를 여러 유저가 쓰면 출전·골이 합쳐진다(베컴 471출전이 그 이유). 출전은 선발만 세고 교체 투입은 제외된다.'],
    ['매치업상', '천적·밥상 부문은 추적 유저 9명끼리의 맞대결만, 5경기 이상에서 뽑았다.'],
    ['제외된 기록', 'xG·골대 맞음·자책골·오프사이드·게임 일시정지·경기 시각(심야 축구왕)·최대 점수차는 이 스냅샷에 없다 — DB를 직접 집계하면 추가할 수 있다.'],
    ['커버리지 주의', '커스텀 집계는 정상 종료(matchEndType=0) 경기만 포함한다. 그 값이 비어 있는 과거 경기는 조용히 빠지므로, 시즌2 초반 일부 경기가 누락됐을 수 있다.']
  ];
  slides.push({
    nav: '집계 기준과 한계',
    html: '<div class="slide">' +
      '<div class="head"><div><h2>집계 기준과 한계</h2></div></div><div class="rule"></div>' +
      '<dl class="notes">' + notes.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' +
      footbar('끝') + '</div>'
  });
}

// ---------------- 렌더 & 조작 ----------------
const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s) => s.html).join('');
const els = [...deck.querySelectorAll('.slide')];
let cur = 0;

function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  els.forEach((el, n) => el.classList.toggle('active', n === cur));
  document.getElementById('progress').style.width = ((cur + 1) / slides.length * 100) + '%';
  location.hash = cur === 0 ? '' : String(cur + 1);
}

// 전체 보기 — 어워드 슬라이드만 카드로 깐다.
const ov = document.getElementById('overview');
ov.innerHTML = '<h3>전체 어워드 ' + DATA.awards.length + '개</h3>' +
  '<div class="hint">카드를 누르면 그 슬라이드로 이동합니다 · O 또는 Esc로 닫기</div><div class="grid">' +
  slides.map((s, i) => s.award
    ? '<div class="card" data-i="' + i + '"><div class="t">' + s.award.icon + ' ' + esc(s.award.title) + '</div>' +
      '<div class="w">' + MEDAL[0] + ' ' + esc(s.award.rows[0] ? s.award.rows[0].who : '-') + '</div>' +
      '<div class="n">' + esc(s.award.section) + '</div></div>'
    : '').join('') + '</div>';
ov.addEventListener('click', (e) => {
  const c = e.target.closest('.card');
  if (c) { show(Number(c.dataset.i)); ov.classList.remove('open'); }
  else if (e.target === ov) ov.classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
  else if (e.key === 'o' || e.key === 'O') ov.classList.toggle('open');
  else if (e.key === 'Escape') ov.classList.remove('open');
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});

// 클릭/터치 — 오른쪽 3분의 2는 다음, 왼쪽 3분의 1은 이전.
document.getElementById('stage').addEventListener('click', (e) => {
  show(e.clientX < window.innerWidth / 3 ? cur - 1 : cur + 1);
});
let tx = null;
document.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 45) show(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, { passive: true });

setTimeout(() => document.getElementById('help').classList.add('gone'), 4000);

show(location.hash ? Number(location.hash.slice(1)) - 1 || 0 : 0);
</script>
